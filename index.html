<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<title>Japan Trip Guide</title>
<meta name="theme-color" content="#1F3F8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: phone app. Thin top bar, one scrolling view, bottom tab bar, details in a bottom sheet. */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#15191C; --muted:#5B636A; --line:#D6DAD3; --soft:#E6E9E3;
  --accent:#1F3F8F; --accent-ink:#FFFFFF; --scrim:rgba(15,18,20,.45);
  --eat:#B9450F; --see:#2C7348; --do:#6C3A94; --shop:#946200; --photo:#0B6E86;
  --tokyo:#1F3F8F; --kyoto:#A33A2A; --osaka:#C27A00; --hakone:#2C7348; --nara:#7A5A2A; --fuji:#0B6E86;
  --star:#C98A00; --done:#2C7348;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#181C20; --ink:#ECEEEF; --muted:#9BA4AB; --line:#2B3238; --soft:#21272C;
  --accent:#8EA7EE; --accent-ink:#0F1214; --scrim:rgba(0,0,0,.6);
  --eat:#F08A5A; --see:#6CC08E; --do:#C29BE6; --shop:#E3B54F; --photo:#5CC6DE;
  --tokyo:#8EA7EE; --kyoto:#F0897A; --osaka:#F2B64B; --hakone:#6CC08E; --nara:#D7B07A; --fuji:#5CC6DE;
  --star:#F2C14B; --done:#6CC08E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#181C20; --ink:#ECEEEF; --muted:#9BA4AB; --line:#2B3238; --soft:#21272C;
  --accent:#8EA7EE; --accent-ink:#0F1214; --scrim:rgba(0,0,0,.6);
  --eat:#F08A5A; --see:#6CC08E; --do:#C29BE6; --shop:#E3B54F; --photo:#5CC6DE;
  --tokyo:#8EA7EE; --kyoto:#F0897A; --osaka:#F2B64B; --hakone:#6CC08E; --nara:#D7B07A; --fuji:#5CC6DE;
  --star:#F2C14B; --done:#6CC08E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:10px;min-height:52px;padding-block:6px}
.hdr-back{width:36px;height:36px;margin-left:-8px;border-radius:10px;display:grid;place-items:center;font-size:24px;line-height:1;color:var(--accent)}
.hdr-txt{flex:1;min-width:0}
.hdr-t{font-family:var(--font-display);font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* main + tab bar */
main{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;font-weight:500;color:var(--muted);text-align:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--accent);font-weight:700}

/* shared bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--done);color:var(--surface)}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* compact rows */
.list{display:grid}
.list.card{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 14px;border-top:1px solid var(--soft)}
.row:first-child{border-top:0}
.rmain{flex:1;min-width:0;display:grid}
.rname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rend{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rend .s{color:var(--star)}
.rend .d{color:var(--done)}
.row.is-done .rname{text-decoration:line-through;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.group-t{padding:4px 2px 0;display:flex;justify-content:space-between;align-items:baseline}

/* today */
.daybar{display:flex;align-items:center;gap:8px}
.daybar button.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;text-align:center}
.daybar button.nav:disabled{opacity:.3}
.daybar .mid{flex:1;min-width:0;text-align:center}
.daybar .d1{font-weight:700}
.daybar .d2{font-size:12.5px;color:var(--muted)}
.daytitle{font-family:var(--font-display);font-size:24px;line-height:1.15;color:var(--cc);text-wrap:balance;margin:2px 0 0}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{min-height:38px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.mini svg{width:16px;height:16px;color:var(--muted)}
.next{padding:16px;display:grid;gap:10px;border-color:var(--accent);border-width:2px}
.next .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.next .kind{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c)}
.next .when{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.next h2{margin:0;font-size:22px;line-height:1.2}
.next p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.next .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.next .acts .wide{grid-column:1/-1}
.next img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.next .more{font-size:13.5px;color:var(--accent);font-weight:700;justify-self:start}
.alldone{padding:18px;text-align:center;display:grid;gap:6px}
.trow{display:flex;align-items:center;border-top:1px solid var(--soft)}
.trow:first-child{border-top:0}
.tcheck{width:52px;align-self:stretch;display:grid;place-items:center;color:var(--line);flex:none}
.tcheck svg{width:24px;height:24px}
.trow.is-done .tcheck{color:var(--done)}
.tmain{flex:1;min-width:0;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;min-height:54px;padding:8px 12px 8px 0}
.ttime{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tname{min-width:0;display:grid}
.tname b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname small{font-size:12px;color:var(--c);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.trow.is-done b{text-decoration:line-through;color:var(--muted);font-weight:500}
.trow.is-next{background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* trip */
.dayrow{display:grid;grid-template-columns:46px 4px 1fr auto;gap:12px;align-items:center;width:100%;min-height:60px;padding:8px 14px;border-top:1px solid var(--soft)}
.dayrow:first-child{border-top:0}
.dayrow .date{display:grid;justify-items:center;line-height:1.05}
.dayrow .date b{font-size:20px;font-variant-numeric:tabular-nums}
.dayrow .date small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dayrow .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.dayrow .t{min-width:0;display:grid}
.dayrow .t b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .t small{color:var(--muted);font-size:12.5px}
.dayrow.today{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.prog{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog.full{color:var(--done);font-weight:700}
details.card{padding:0}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px;font-weight:700;cursor:pointer;min-height:52px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";font-size:20px;color:var(--muted);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
.dbody{padding:0 14px 14px;display:grid;gap:0}
.irow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--soft);font-size:14px}
.irow:first-child{border-top:0}
.irow .r{text-align:right;font-variant-numeric:tabular-nums}
.irow .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.irow .sub a,.irow a{color:var(--accent);font-weight:700;text-decoration:none}
.pill{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.pill.ok{color:var(--done)} .pill.due{color:var(--eat)}
ol.tips{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}

/* explore */
.search{position:relative}
.search input{width:100%;min-height:46px;font:inherit;font-size:16px;padding:0 14px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;display:grid;gap:2px;min-height:92px;align-content:end;border-left:5px solid var(--c)}
.tile .jp{font-size:12px;color:var(--muted);letter-spacing:.15em}
.tile b{font-family:var(--font-display);font-size:19px;font-weight:400;color:var(--c)}
.tile small{font-size:12.5px;color:var(--muted)}
.nearbtn{display:flex;align-items:center;gap:12px;padding:14px;width:100%}
.nearbtn svg{width:22px;height:22px;color:var(--accent)}
.nearbtn b{display:block}
.nearbtn small{color:var(--muted);font-size:13px}
.filterrow{display:flex;gap:8px;align-items:center}
.filterrow .chips{flex:1;margin-right:0}
.fbtn{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.fbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.fpanel{display:flex;flex-wrap:wrap;gap:6px}
.neigh{display:flex;flex-wrap:wrap;gap:6px}
.neigh button{min-height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.mix{display:flex;gap:4px}
.mix i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet .panel{position:relative;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease-out;display:grid;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin-bottom:2px}
.sclose{position:absolute;right:10px;top:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted);text-align:center}
.s-kind{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c);padding-right:40px}
.s-name{margin:0;font-size:23px;line-height:1.2;padding-right:30px}
.s-meta{color:var(--muted);font-size:14px}
.s-desc{font-size:15.5px}
.s-note{font-size:14px;background:var(--soft);border-radius:10px;padding:10px 12px}
.s-note b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.s-note a{color:var(--accent)}
.s-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s-acts .wide{grid-column:1/-1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.book{color:var(--eat);border-color:currentColor}
.tag.must{color:var(--star);border-color:currentColor}
.photo{display:grid;gap:4px}
.photo img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;background:var(--soft);display:block}
.photo small{font-size:11.5px;color:var(--muted)}
.photo small a{color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);border-width:2px}
.opt .rmain{flex:1}
.daymap{display:block;width:100%;height:auto;border-radius:12px}
.daymap .ml{font-family:var(--font-body);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
.daymap .ml.dim{fill:var(--muted);font-size:9.5px}
.daymap .ml.strong{font-weight:700;font-size:12px}
.daymap .ml.num{fill:var(--surface);stroke:none;font-weight:700;font-size:12px}
ol.route{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.route li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
ol.route a{color:var(--accent);font-weight:700;text-decoration:none;font-size:13.5px}
.rn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:var(--surface);font-size:12px;font-weight:700}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet .panel,.sheet .scrim{animation:none}details.card summary::after{transition:none}}
</style>

</head>
<body>
<header class="hdr"><div class="wrap hdr-in" id="hdr"></div></header>
<main class="wrap" id="view"></main>
<nav class="tabbar" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>

      const opts = e.o.map(n => findItem(n,['eat']) || {text:n});
      const j = Math.min(mealPick[iso+'|'+i]||0, opts.length-1);

      return {i, e, kind:'meal', label:e.meal, item: pick.text?null:pick, text: pick.text||null, opts, j, key: pick.text ? 'tl|'+iso+'|'+i : pick._k};
    }

function orderAreas(keys){
  const geo = keys.filter(k => AREAS[k].lat != null), rest = keys.filter(k => AREAS[k].lat == null);
  const cnt = k => ITEMS.filter(i => i.area === k).length;
  const dist = (a,b) => { const A=AREAS[a],B=AREAS[b]; const x=(B.lng-A.lng)*Math.cos((A.lat+B.lat)/2*Math.PI/180), y=B.lat-A.lat; return Math.hypot(x,y) };
  const out = [];
  if (geo.length){ let cur = geo.slice().sort((a,b)=>cnt(b)-cnt(a))[0], left = new Set(geo);
    while (cur){ out.push(cur); left.delete(cur); let best=null,bd=1e9; for (const k of left){ const d=dist(cur,k); if (d<bd){bd=d;best=k} } cur=best } }

function mapSVG(city, stops, hotel){
  const W=360, H=240, pad=36;
  const pts = Object.entries(AREAS).filter(([k,a]) => a.city===city && a.lat!=null);
  const showHotel = hotel && hotel.lat!=null && hotel.city===city;
  // zoom to today's stops + hotel, then show whatever neighbourhoods fall inside
  const all = stops.filter(k=>AREAS[k].city===city).map(k=>[AREAS[k].lat,AREAS[k].lng]);
  if (showHotel) all.push([hotel.lat, hotel.lng]);
  let la0=Math.min(...all.map(p=>p[0])), la1=Math.max(...all.map(p=>p[0])), lo0=Math.min(...all.map(p=>p[1])), lo1=Math.max(...all.map(p=>p[1]));
  const cLat=(la0+la1)/2, cLng=(lo0+lo1)/2, kx=Math.cos(cLat*Math.PI/180);
  const sx=Math.max((lo1-lo0)*kx*1.25, .035), sy=Math.max((la1-la0)*1.25, .025);
  const sc=Math.min((W-2*pad)/sx, (H-2*pad)/sy);
  const P=(lat,lng)=>[W/2+(lng-cLng)*kx*sc, H/2-(lat-cLat)*sc];
  const inside = ([x,y]) => x>10 && x<W-10 && y>10 && y<H-10;
  let s = '<svg class="daymap" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Map of '+esc(city)+' neighbourhoods with today’s stops">';
  s += '<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="12" style="fill:var(--soft)"/>';
  // other neighbourhoods
  for (const [k,a] of pts){
    if (stops.includes(k)) continue;
    const [x,y]=P(a.lat,a.lng); const n=ITEMS.filter(i=>i.area===k).length;
    if (!inside([x,y])) continue;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(3+Math.sqrt(n)*.8).toFixed(1)+'" style="fill:var(--line)"><title>'+esc(a.label)+'</title></circle>';
    s += '<text x="'+x.toFixed(1)+'" y="'+(y+14).toFixed(1)+'" class="ml dim" text-anchor="middle">'+esc(placeName(k))+'</text>';
  }
  // route
  const route = [];
  if (showHotel) route.push(P(hotel.lat,hotel.lng));
  stops.filter(k=>AREAS[k].city===city).forEach(k=>route.push(P(AREAS[k].lat,AREAS[k].lng)));
  if (route.length>1) s += '<polyline points="'+route.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')+'" style="fill:none;stroke:var(--cc);stroke-width:2;stroke-dasharray:5 4;opacity:.8"/>';
  // hotel
  if (showHotel){
    const [x,y]=P(hotel.lat,hotel.lng);
    s += '<rect x="'+(x-7).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" width="14" height="14" rx="3" style="fill:var(--ink)"/><path d="M'+(x-4).toFixed(1)+' '+(y+3).toFixed(1)+'v-4l4-3 4 3v4z" style="fill:var(--soft)"/>';
    s += '<text x="'+x.toFixed(1)+'" y="'+(y+22).toFixed(1)+'" class="ml strong" text-anchor="middle">'+esc(hotel.short)+'</text>';
  }
  // stops
  stops.filter(k=>AREAS[k].city===city).forEach((k,i)=>{
    const [x,y]=P(AREAS[k].lat,AREAS[k].lng); const right = x < W-110;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="11" style="fill:var(--cc)"/>';
    s += '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" class="ml num">'+(stops.indexOf(k)+1)+'</text>';
    s += '<text x="'+(right?x+15:x-15).toFixed(1)+'" y="'+(y-8).toFixed(1)+'" class="ml strong"'+(right?'':' text-anchor="end"')+'>'+esc(placeName(k))+'</text>';
  });
  // scale bar
  const pxPerKm = sc/111; const km=[.5,1,2,5,10].find(v=>v*pxPerKm>=40)||10; const bw=km*pxPerKm;
  s += '<line x1="14" y1="'+(H-14)+'" x2="'+(14+bw).toFixed(1)+'" y2="'+(H-14)+'" style="stroke:var(--muted);stroke-width:2"/><text x="'+(18+bw).toFixed(1)+'" y="'+(H-10)+'" class="ml dim">'+km+' km</text>';
  s += '<text x="'+(W-12)+'" y="20" text-anchor="end" class="ml dim">N ↑</text>';
  return s + '</svg>';
}

async function wikiThumb(it){

      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g,'_')));
      if (r.ok){ const j = await r.json(); if (j.thumbnail) res = {src:j.thumbnail.source.replace(/\/\d+px-/, '/640px-'), page:(j.content_urls&&j.content_urls.mobile&&j.content_urls.mobile.page)||'', title:j.title} }

      const r = await fetch(u);

        if (pg && pg.thumbnail){
          const t = norm(pg.title).replace(/[^a-z0-9 ]/g,' ');
          const words = norm(it.name).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length>=4 && !GENERIC.has(w));
          const ok = words.length ? words.some(w => t.includes(w.replace(/-?(ji|in|dera)$/,''))) : t.includes(norm(it.name));
          if (ok) res = {src:pg.thumbnail.source, page:pg.fullurl||'', title:pg.title};
        } }
    }
    wikiOK.v = true;
  }catch(e){ wikiOK.v = false; return null }   // blocked here: don't cache, just skip
  store.set(ck, res);
  return res;
}
function loadPhotos(root){
  if (wikiOK.v === false) return;
  root.querySelectorAll('.photo-slot[data-photo]').forEach(async el => {
    const it = BYKEY[el.dataset.photo]; if (!photoEligible(it)) return;
    const p = await wikiThumb(it); if (!p || !el.isConnected) return;
    el.className = 'photo';
    el.innerHTML = '<img src="'+esc(p.src)+'" alt="'+esc(it.name)+'" loading="lazy" onerror="this.parentNode.remove()"><small>Photo from Wikipedia'+(p.page?' · <a href="'+esc(p.page)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>':'')+'</small>';
  });
}

// ---------- render ----------
function render(keepScroll){
  const y = window.scrollY;
  renderTabs();
  const v = $('#view');
  v.innerHTML = S.tab==='today' ? renderToday() : S.tab==='trip' ? renderTrip() : S.tab==='explore' ? renderExplore() : renderSaved();
  loadPhotos(v);
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  save();
}
function rerenderAll(){ render(true); if (sheetOpen && lastSheet) lastSheet() }
let lastSheet = null;
function sheet(fn){ lastSheet = fn; fn() }

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-back],[data-day],[data-goday],[data-city],[data-area],[data-cat],[data-f],[data-fopen],[data-open],[data-topen],[data-tdone],[data-done],[data-star],[data-meal],[data-hotel],[data-tips],[data-daymap],[data-nearby],[data-near],[data-close]');
  if (!t) return;
  const d = t.dataset;
  if (d.close){ closeSheet(); return }
  if (d.tab){ if (S.tab===d.tab && d.tab==='explore'){ S.city=null; S.area=null; S.q='' } S.tab = d.tab; closeSheet(); render(); return }
  if (d.back){ if (d.back==='city') S.area=null; else { S.city=null; S.area=null } render(); return }
  if (d.day !== undefined){ if (d.day){ S.day = d.day; render() } return }
  if (d.goday){ S.day = d.goday; S.tab='today'; render(); return }
  if (d.city){ S.city = d.city; S.area = null; S.cat='all'; render(); return }
  if (d.area){ S.tab='explore'; S.area = d.area; S.city = AREAS[d.area].city; S.q=''; closeSheet(); render(); return }
  if (d.cat){ S.cat = d.cat; render(true); return }
  if (d.fopen){ S.fopen = !S.fopen; render(true); return }
  if (d.f){ S[d.f] = !S[d.f]; render(true); return }
  if (d.open){ const it = BYKEY[d.open]; if (it) sheet(() => openSheet(itemSheet(it))); return }
  if (d.topen !== undefined){ const iso=S.day, i=d.topen; sheet(() => timelineSheet(iso, i)); return }
  if (d.tdone){ toggle(done,'done',d.tdone); render(true); return }
  if (d.done){ toggle(done,'done',d.done); rerenderAll(); return }
  if (d.star){ toggle(starred,'star',d.star); rerenderAll(); return }
  if (d.meal){ const [iso,i,j] = d.meal.split('|'); mealPick[iso+'|'+i] = +j; store.set('meal', mealPick); rerenderAll(); return }
  if (d.hotel){ sheet(() => hotelSheet(d.hotel)); return }
  if (d.tips){ sheet(tipsSheet); return }
  if (d.daymap){ sheet(mapSheet); return }
  if (d.nearby){ const k = PLAN[S.day].stops[0]; S.tab='explore'; S.area=k; S.city=AREAS[k].city; render(); return }
  if (d.near){ findNear(); return }
});
function toggle(set, name, k){ set.has(k) ? set.delete(k) : set.add(k); store.set(name, [...set]) }
let qt;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(qt);
  qt = setTimeout(() => {
    const was = !!S.q; S.q = e.target.value.trim();
    if (was && S.q && $('#res')){ $('#res').innerHTML = searchResults(); return }
    const pos = e.target.selectionStart; render(true); const q=$('#q'); if (q){ q.focus(); try{ q.setSelectionRange(pos,pos) }catch(x){} }
  }, 200);
});
function findNear(){
  if (!navigator.geolocation){ S.nearMsg = 'Location isn’t available in this browser.'; render(true); return }
  S.nearMsg = 'Finding you…'; render(true);
  navigator.geolocation.getCurrentPosition(
    pos => { S.near = [pos.coords.latitude, pos.coords.longitude]; S.nearMsg = 'Closest neighbourhoods to you right now'; render(true) },
    () => { S.nearMsg = 'Location isn’t available here. On the GitHub version, allow location when asked.'; render(true) },
    {enableHighAccuracy:false, timeout:10000, maximumAge:120000});
}
// swipe between days on Today
let sx=null, sy=null;
$('#view').addEventListener('touchstart', e => { if (S.tab!=='today') return; sx=e.touches[0].clientX; sy=e.touches[0].clientY }, {passive:true});
$('#view').addEventListener('touchend', e => {
  if (sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if (Math.abs(dx)>70 && Math.abs(dy)<45){ const i = DAYS.indexOf(S.day)+(dx<0?1:-1); if (DAYS[i]){ S.day=DAYS[i]; render() } }
}, {passive:true});

render();
})();
</script>
